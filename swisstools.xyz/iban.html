      background-size: cover;
      background-position: center 30%;
      background-attachment: fixed;
      font-family: 'Barlow Condensed', sans-serif;
    }
    .overlay {
      position: fixed; inset: 0;
      backdrop-filter: blur(6px) saturate(0.6) brightness(0.52);
      -webkit-backdrop-filter: blur(6px) saturate(0.6) brightness(0.52);
    }
    .content {
      position: relative; z-index: 1;
      max-width: 700px; margin: 0 auto;
      padding: 60px 24px 100px;
    }
    /* Header */
    .tag { font-weight:500; font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:12px; }
    h1 { font-weight:900; font-size:clamp(52px,10vw,90px); line-height:0.9; text-transform:uppercase; letter-spacing:-0.01em; color:#fff; margin-bottom:16px; }
    .subtitle { font-family:'Barlow',sans-serif; font-weight:300; font-size:14px; color:rgba(255,255,255,0.45); line-height:1.6; max-width:440px; margin-bottom:52px; }
    /* Input */
    .input-row { display:flex; border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.35); backdrop-filter:blur(10px); overflow:hidden; margin-bottom:10px; }
    #ibanInput { flex:1; background:transparent; border:none; outline:none; color:#fff; font-family:'Barlow Condensed',sans-serif; font-weight:500; font-size:22px; letter-spacing:0.08em; padding:20px 24px; text-transform:uppercase; }
    #ibanInput::placeholder { color:rgba(255,255,255,0.3); font-size:18px; }
    #checkBtn { background:rgba(255,255,255,0.12); border:none; border-left:1px solid rgba(255,255,255,0.15); color:#fff; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px; letter-spacing:0.18em; text-transform:uppercase; padding:0 28px; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:10px; }
    #checkBtn:hover { background:#fff; color:#000; }
    /* Examples */
    .examples { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:44px; }
    .ex { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); padding:5px 12px; cursor:pointer; transition:all 0.15s; }
    .ex:hover { background:rgba(255,255,255,0.18); color:#fff; }
    /* Panels */
    .panel { padding:20px 24px; background:rgba(0,0,0,0.42); border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(4px); margin-bottom:2px; }
    .panel-label { font-weight:400; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-bottom:10px; }
    .panel-value { font-weight:700; font-size:22px; color:#fff; line-height:1.15; }
    .panel-muted { font-family:'Barlow',sans-serif; font-weight:300; font-size:13px; color:rgba(255,255,255,0.42); margin-top:4px; }
    /* Status */
    .status { display:flex; align-items:center; gap:16px; padding:18px 24px; border:1px solid rgba(255,255,255,0.18); background:rgba(0,0,0,0.42); margin-bottom:2px; }
    .status.invalid { background:rgba(160,20,20,0.25); border-color:rgba(255,80,80,0.4); }
    .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; background:#fff; box-shadow:0 0 12px rgba(255,255,255,0.5); }
    .status.invalid .dot { background:#ff4d4d; box-shadow:0 0 12px rgba(255,77,77,0.6); }
    .status-text { font-weight:800; font-size:22px; letter-spacing:0.1em; color:#fff; text-transform:uppercase; }
    .status-right { font-family:'Barlow',sans-serif; font-size:13px; color:rgba(255,255,255,0.38); margin-left:auto; }
    /* IBAN display */
    .iban-display { font-weight:700; font-size:clamp(16px,4vw,26px); letter-spacing:0.12em; color:#fff; word-break:break-all; margin-bottom:10px; }
    .iban-cc { color:rgba(255,255,255,0.45); }
    .iban-check { color:rgba(255,255,255,0.65); }
    .iban-legend { display:flex; gap:20px; flex-wrap:wrap; }
    .iban-legend span { font-family:'Barlow',sans-serif; font-size:11px; color:rgba(255,255,255,0.3); }
    /* Grid */
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:2px; margin-bottom:2px; }
    @media(max-width:480px){ .grid2 { grid-template-columns:1fr; } }
    /* Bank panel */
    .bank-panel { padding:20px 24px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.22); margin-bottom:2px; }
    .bic-value { font-weight:700; font-size:20px; color:rgba(255,255,255,0.8); letter-spacing:0.12em; margin-top:10px; }
    .bic-value span { color:#fff; }
    /* BBAN blocks */
    .bban-row { display:flex; gap:4px; flex-wrap:wrap; }
    .bban-block { display:flex; flex-direction:column; }
    .bban-digits { font-weight:700; font-size:17px; color:#fff; letter-spacing:0.08em; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); padding:8px 14px; }
    .bban-name { font-weight:500; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.28); margin-top:5px; }
    /* Detail rows */
    .detail-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
    .detail-row:last-child { border-bottom:none; }
    .detail-key { font-weight:500; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.38); }
    .detail-val { font-weight:700; font-size:15px; color:#fff; letter-spacing:0.05em; }
    /* SEPA */
    .sepa-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 24px; }
    .sepa-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
    .sepa-row:last-child { border-bottom:none; }
    .sepa-key { font-weight:500; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.38); }
    .sepa-val { font-weight:700; font-size:14px; }
    .sepa-yes { color:rgba(180,255,200,0.9); }
    .sepa-no { color:rgba(255,255,255,0.4); }
    /* Spinner */
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
    /* Error */
    .error-panel { padding:20px 24px; background:rgba(150,30,0,0.2); border:1px solid rgba(255,120,80,0.4); margin-bottom:2px; }
    /* Animate */
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation:fadeUp 0.35s ease both; }
    .hidden { display:none; }
    /* Empty */
    .empty { font-weight:300; font-size:18px; color:rgba(255,255,255,0.22); letter-spacing:0.05em; line-height:1.6; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">

    <div class="tag">Finanz-Analyse</div>
    <h1>IBAN<br>ANALYSE</h1>
    <p class="subtitle">Lokale MOD-97 Validierung · Strukturanalyse · Live BIC &amp; Bankname</p>

    <div class="input-row">
      <input id="ibanInput" type="text" placeholder="IBAN EINGEBEN …" spellcheck="false" autocomplete="off">
      <button id="checkBtn" onclick="analyze()">PRÜFEN</button>
    </div>

    <div class="examples">
      <button class="ex" onclick="loadExample('DE89370400440532013000')">DE</button>
      <button class="ex" onclick="loadExample('AT611904300234573201')">AT</button>
      <button class="ex" onclick="loadExample('CH9300762011623852957')">CH</button>
      <button class="ex" onclick="loadExample('GB29NWBK60161331926819')">GB</button>
      <button class="ex" onclick="loadExample('FR7630006000011234567890189')">FR</button>
      <button class="ex" onclick="loadExample('NL91ABNA0417164300')">NL</button>
      <button class="ex" onclick="loadExample('IT60X0542811101000000123456')">IT</button>
      <button class="ex" onclick="loadExample('EE471000001020145685')">EE</button>
    </div>

    <div id="empty" class="empty">IBAN eingeben und PRÜFEN klicken,<br>oder ein Beispiel auswählen.</div>
    <div id="results" class="hidden"></div>

  </div>

  <script>
  const SUPABASE_URL = 'https://dccnzsniksrddeurhvqn.supabase.co/functions/v1/iban-proxy';

  const REGISTRY = {
    AD:{name:"Andorra",flag:"🇦🇩",len:24,cur:"EUR",sepa:true,bban:{bank:[4,8],branch:[8,12],account:[12,24]}},
    AT:{name:"Österreich",flag:"🇦🇹",len:20,cur:"EUR",sepa:true,bban:{bank:[4,9],account:[9,20]}},
    BE:{name:"Belgien",flag:"🇧🇪",len:16,cur:"EUR",sepa:true,bban:{bank:[4,7],account:[7,14],check:[14,16]}},
    CH:{name:"Schweiz",flag:"🇨🇭",len:21,cur:"CHF",sepa:true,bban:{bank:[4,9],account:[9,21]}},
    CY:{name:"Zypern",flag:"🇨🇾",len:28,cur:"EUR",sepa:true,bban:{bank:[4,7],branch:[7,12],account:[12,28]}},
    DE:{name:"Deutschland",flag:"🇩🇪",len:22,cur:"EUR",sepa:true,bban:{bank:[4,12],account:[12,22]}},
    DK:{name:"Dänemark",flag:"🇩🇰",len:18,cur:"DKK",sepa:true,bban:{bank:[4,8],account:[8,17],check:[17,18]}},
    EE:{name:"Estland",flag:"🇪🇪",len:20,cur:"EUR",sepa:true,bban:{bank:[4,6],branch:[6,8],account:[8,19],check:[19,20]}},
    ES:{name:"Spanien",flag:"🇪🇸",len:24,cur:"EUR",sepa:true,bban:{bank:[4,8],branch:[8,12],check1:[12,13],check2:[13,14],account:[14,24]}},
    FI:{name:"Finnland",flag:"🇫🇮",len:18,cur:"EUR",sepa:true,bban:{bank:[4,10],account:[10,17],check:[17,18]}},
    FR:{name:"Frankreich",flag:"🇫🇷",len:27,cur:"EUR",sepa:true,bban:{bank:[4,9],branch:[9,14],account:[14,25],check:[25,27]}},
    GB:{name:"Großbritannien",flag:"🇬🇧",len:22,cur:"GBP",sepa:true,bban:{bank:[4,8],branch:[8,14],account:[14,22]}},
    GR:{name:"Griechenland",flag:"🇬🇷",len:27,cur:"EUR",sepa:true,bban:{bank:[4,7],branch:[7,11],account:[11,27]}},
    HR:{name:"Kroatien",flag:"🇭🇷",len:21,cur:"EUR",sepa:true,bban:{bank:[4,11],account:[11,21]}},
    HU:{name:"Ungarn",flag:"🇭🇺",len:28,cur:"HUF",sepa:true,bban:{bank:[4,7],branch:[7,11],account:[11,27],check:[27,28]}},
    IE:{name:"Irland",flag:"🇮🇪",len:22,cur:"EUR",sepa:true,bban:{bank:[4,8],branch:[8,14],account:[14,22]}},
    IT:{name:"Italien",flag:"🇮🇹",len:27,cur:"EUR",sepa:true,bban:{check:[4,5],bank:[5,10],branch:[10,15],account:[15,27]}},
    LI:{name:"Liechtenstein",flag:"🇱🇮",len:21,cur:"CHF",sepa:true,bban:{bank:[4,9],account:[9,21]}},
    LT:{name:"Litauen",flag:"🇱🇹",len:20,cur:"EUR",sepa:true,bban:{bank:[4,9],account:[9,20]}},
    LU:{name:"Luxemburg",flag:"🇱🇺",len:20,cur:"EUR",sepa:true,bban:{bank:[4,7],account:[7,20]}},
    LV:{name:"Lettland",flag:"🇱🇻",len:21,cur:"EUR",sepa:true,bban:{bank:[4,8],account:[8,21]}},
    MC:{name:"Monaco",flag:"🇲🇨",len:27,cur:"EUR",sepa:true,bban:{bank:[4,9],branch:[9,14],account:[14,25],check:[25,27]}},
    MT:{name:"Malta",flag:"🇲🇹",len:31,cur:"EUR",sepa:true,bban:{bank:[4,8],branch:[8,13],account:[13,31]}},
    NL:{name:"Niederlande",flag:"🇳🇱",len:18,cur:"EUR",sepa:true,bban:{bank:[4,8],account:[8,18]}},
    NO:{name:"Norwegen",flag:"🇳🇴",len:15,cur:"NOK",sepa:true,bban:{bank:[4,8],account:[8,14],check:[14,15]}},
    PL:{name:"Polen",flag:"🇵🇱",len:28,cur:"PLN",sepa:true,bban:{bank:[4,8],branch:[8,12],account:[12,28]}},
    PT:{name:"Portugal",flag:"🇵🇹",len:25,cur:"EUR",sepa:true,bban:{bank:[4,8],branch:[8,12],account:[12,23],check:[23,25]}},
    RO:{name:"Rumänien",flag:"🇷🇴",len:24,cur:"RON",sepa:true,bban:{bank:[4,8],account:[8,24]}},
    SE:{name:"Schweden",flag:"🇸🇪",len:24,cur:"SEK",sepa:true,bban:{bank:[4,7],account:[7,23],check:[23,24]}},
    SI:{name:"Slowenien",flag:"🇸🇮",len:19,cur:"EUR",sepa:true,bban:{bank:[4,9],account:[9,17],check:[17,19]}},
    SK:{name:"Slowakei",flag:"🇸🇰",len:24,cur:"EUR",sepa:true,bban:{bank:[4,8],account:[8,18]}},
    TR:{name:"Türkei",flag:"🇹🇷",len:26,cur:"TRY",sepa:false,bban:{bank:[4,9],account:[10,26]}},
    UA:{name:"Ukraine",flag:"🇺🇦",len:29,cur:"UAH",sepa:false,bban:{bank:[4,10],account:[10,29]}},
  };

  const BBAN_LABELS = {
    bankCode:"BANKLEITZAHL", branchCode:"FILIALE", accountNumber:"KONTONUMMER",
    checkDigit:"PRÜFZIFFER", checkDigit1:"PRÜFZIFFER 1", checkDigit2:"PRÜFZIFFER 2",
  };

  function toNumeric(iban) {
    return (iban.slice(4)+iban.slice(0,4)).split('').map(c=>{
      const code=c.charCodeAt(0); return code>=65?(code-55).toString():c;
    }).join('');
  }
  function mod97(s){ let r=0; for(const c of s) r=(r*10+parseInt(c))%97; return r; }

  function validate(raw) {
    const iban=raw.replace(/\s/g,'').toUpperCase();
    if(iban.length<4) return {valid:false,error:'Zu kurz'};
    const cc=iban.slice(0,2);
    if(!/^[A-Z]{2}$/.test(cc)) return {valid:false,error:'Ungültiger Ländercode'};
    const c=REGISTRY[cc];
    if(!c) return {valid:false,error:`Ländercode ${cc} nicht bekannt`};
    if(iban.length!==c.len) return {valid:false,error:`Falsche Länge: ${iban.length} statt ${c.len}`};
    if(!/^\d{2}$/.test(iban.slice(2,4))) return {valid:false,error:'Prüfziffern ungültig'};
    const rem=mod97(toNumeric(iban));
    return {valid:rem===1, error:rem!==1?`MOD-97 Fehler (Rest: ${rem})`:null};
  }

  function parseBBAN(cc, bban) {
    const s=REGISTRY[cc]?.bban||{};
    const parts={};
    if(s.bank) parts.bankCode=bban.slice(s.bank[0]-4,s.bank[1]-4);
    if(s.branch) parts.branchCode=bban.slice(s.branch[0]-4,s.branch[1]-4);
    if(s.account) parts.accountNumber=bban.slice(s.account[0]-4,s.account[1]-4);
    if(s.check) parts.checkDigit=bban.slice(s.check[0]-4,s.check[1]-4);
    if(s.check1) parts.checkDigit1=bban.slice(s.check1[0]-4,s.check1[1]-4);
    if(s.check2) parts.checkDigit2=bban.slice(s.check2[0]-4,s.check2[1]-4);
    return parts;
  }

  function loadExample(val) {
    document.getElementById('ibanInput').value=val;
    analyze();
  }

  async function analyze() {
    const raw=document.getElementById('ibanInput').value.replace(/\s/g,'').toUpperCase();
    if(raw.length<2) return;
    document.getElementById('ibanInput').value=raw;

    const v=validate(raw);
    const cc=raw.slice(0,2);
    const checkDigits=raw.slice(2,4);
    const bban=raw.slice(4);
    const country=REGISTRY[cc];
    const parts=country?parseBBAN(cc,bban):{};
    const groups=raw.match(/.{1,4}/g)||[];

    document.getElementById('empty').classList.add('hidden');
    const results=document.getElementById('results');
    results.classList.remove('hidden');

    // Build static HTML first
    let html=`
      <div class="fade-up">
        <div class="status ${v.valid?'':'invalid'}">
          <div class="dot"></div>
          <span class="status-text">${v.valid?'GÜLTIGE IBAN':'UNGÜLTIGE IBAN'}</span>
          <span class="status-right">${v.valid?'MOD-97 ✓':v.error}</span>
        </div>

        <div class="panel">
          <div class="panel-label">IBAN</div>
          <div class="iban-display">
            ${groups.map((g,i)=>`<span class="${i===0?'iban-cc':i===1?'iban-check':''}">${g}</span>`).join(' ')}
          </div>
          <div class="iban-legend">
            <span><span style="color:rgba(255,255,255,0.45)">■</span> Ländercode</span>
            <span><span style="color:rgba(255,255,255,0.65)">■</span> Prüfziffern</span>
            <span><span style="color:#fff">■</span> BBAN</span>
          </div>
        </div>

        <div id="apiResult">
          ${v.valid?'<div class="panel" style="display:flex;align-items:center;gap:14px"><div class="spinner"></div><span style="font-weight:500;font-size:16px;letter-spacing:0.12em;color:rgba(255,255,255,0.5)">LIVE-DATEN WERDEN GELADEN …</span></div>':''}
        </div>

        ${country?`
        <div class="grid2">
          <div class="panel">
            <div class="panel-label">LAND</div>
            <div class="panel-value">${country.flag} ${country.name}</div>
            <div class="panel-muted">${cc} · ${country.cur}${country.sepa?' · SEPA':''}</div>
          </div>
          <div class="panel">
            <div class="panel-label">PRÜFZIFFERN</div>
            <div class="panel-value" style="font-size:34px">${checkDigits}</div>
            <div class="panel-muted">MOD-97 · Pos. 3–4</div>
          </div>
        </div>`:''}

        ${Object.keys(parts).length?`
        <div class="panel">
          <div class="panel-label">BBAN STRUKTUR</div>
          <div class="bban-row">
            ${Object.entries(parts).map(([k,v])=>`
              <div class="bban-block">
                <div class="bban-digits">${v}</div>
                <div class="bban-name">${BBAN_LABELS[k]||k}</div>
              </div>
            `).join('')}
          </div>
        </div>`:''}

        <div class="panel">
          <div class="panel-label">TECHNISCHE DETAILS</div>
          <div class="detail-row"><span class="detail-key">SEPA-fähig</span><span class="detail-val">${country?.sepa?'Ja':'Nein'}</span></div>
          <div class="detail-row"><span class="detail-key">IBAN-Länge</span><span class="detail-val">${raw.length} / ${country?.len} Zeichen</span></div>
          <div class="detail-row"><span class="detail-key">MOD-97</span><span class="detail-val">${v.valid?'Rest = 1 ✓':v.error}</span></div>
          <div class="detail-row"><span class="detail-key">Rohes BBAN</span><span class="detail-val" style="font-size:12px">${bban}</span></div>
        </div>
      </div>
    `;
    results.innerHTML=html;

    // Fetch live data
    if(v.valid) {
      try {
        const res=await fetch(SUPABASE_URL,{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjY256c25pa3NyZGRldXJodnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NzEwODQsImV4cCI6MjA5MDU0NzA4NH0.ZdxS6Up_WGcGC1XNAaCYNZLZSreOOCBnbjtvQOuKpzc'
          },
          body:JSON.stringify({iban:raw})
        });
        const json=await res.json();
        const apiDiv=document.getElementById('apiResult');
        if(json.result===200&&json.data?.bank) {
          const b=json.data.bank;
          const sepa=json.data.sepa||{};
          const sepaEntries=Object.entries(sepa);
          apiDiv.innerHTML=`
            <div class="bank-panel">
              <div class="panel-label">🏦 BANK</div>
              <div class="panel-value" style="font-size:28px">${b.bank_name}</div>
              ${b.bic?`<div class="bic-value">BIC / SWIFT: <span>${b.bic}</span></div>`:''}
              ${(b.address||b.city)?`<div class="panel-muted">${[b.address,b.zip,b.city].filter(Boolean).join(', ')}</div>`:''}
              ${b.phone?`<div class="panel-muted">Tel: ${b.phone}</div>`:''}
            </div>
            ${sepaEntries.length?`
            <div class="panel">
              <div class="panel-label">SEPA-DETAILS</div>
              <div class="sepa-grid">
                ${sepaEntries.map(([k,v])=>`
                  <div class="sepa-row">
                    <span class="sepa-key">${k.replace(/_/g,' ')}</span>
                    <span class="sepa-val ${v==='Yes'?'sepa-yes':'sepa-no'}">${v==='Yes'?'✓':'—'}</span>
                  </div>
                `).join('')}
              </div>
            </div>`:''}
          `;
        } else {
          apiDiv.innerHTML=`<div class="error-panel"><div class="panel-label">API-FEHLER</div><div class="panel-value" style="font-size:16px;color:rgba(255,180,150,1)">${json.message||json.error||'Unbekannter Fehler'}</div></div>`;
        }
      } catch(e) {
        document.getElementById('apiResult').innerHTML=`<div class="error-panel"><div class="panel-label">FEHLER</div><div class="panel-value" style="font-size:16px;color:rgba(255,180,150,1)">Netzwerkfehler</div></div>`;
      }
    }
  }

  document.getElementById('ibanInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') analyze();
  });
  </script>
</body>
</html>
